<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Locked Island Site</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #232323;
      color: white;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;
      opacity: 0.5;
    }

    #lock-screen, #main-content {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      transition: opacity 0.5s ease;
    }

    #lock-screen {
      background: radial-gradient(circle at center, rgba(0, 255, 255, 0.1) 0%, transparent 70%);
    }

    #main-content {
      display: none;
      opacity: 0;
    }

    #lock-screen.loading::before {
      content: '';
      position: absolute;
      width: 40px;
      height: 40px;
      border: 4px solid #00ffff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .lock-card {
      background: #161b22;
      padding: 2em;
      border-radius: 15px;
      box-shadow: 0 0 20px #00ffff44, 0 0 40px #00ffff22;
      border: 1px solid #00ffff33;
      text-align: center;
      width: 300px;
      position: relative;
    }

    .lock-card.loading::after {
      content: "Verifying...";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: -2.5em;
      color: #00ffff;
      font-size: 1em;
      text-shadow: 0 0 5px #00ffff88;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .site-title {
      font-size: 4em;
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff88;
      margin-bottom: 1em;
      animation: glitch 2s linear infinite;
      position: relative;
      font-weight: bold;
      text-transform: uppercase;
    }

    @keyframes glitch {
      0% {
        transform: translate(0);
        opacity: 1;
      }
      2% {
        transform: translate(2px, -2px);
        opacity: 0.8;
      }
      4% {
        transform: translate(-2px, 2px);
        opacity: 0.6;
      }
      6% {
        transform: translate(0);
        opacity: 1;
      }
      8% {
        transform: translate(3px, 1px);
        opacity: 0.7;
      }
      10% {
        transform: translate(-3px, -1px);
        opacity: 0.9;
      }
      12% {
        transform: translate(0);
        opacity: 1;
      }
      100% {
        transform: translate(0);
        opacity: 1;
      }
    }

    input[type="password"] {
      padding: 0.6em 1em;
      border: 1px solid #00ffff44;
      border-radius: 8px;
      font-size: 1em;
      background: #0d1117;
      color: white;
      width: 100%;
      box-sizing: border-box;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    input[type="password"]:focus {
      outline: none;
      border-color: #00ffff;
      box-shadow: 0 0 8px #00ffff88;
    }

    button {
      margin-top: 1.5em;
      padding: 0.6em 1.5em;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: linear-gradient(45deg, #1f6feb, #00ffff);
      color: white;
      transition: transform 0.2s, box-shadow 0.3s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 15px #00ffff88;
    }

    #iframe-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 100px;
      display: none;
      padding: 1em;
      box-sizing: border-box;
    }

    #iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 20px;
      overflow: hidden;
    }

    #bookmarklet-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 100px;
      padding: 2em;
      overflow-y: auto;
      box-sizing: border-box;
      justify-content: center;
      align-items: flex-start;
    }

    .bookmarklet-box {
      background: #161b22;
      border: 1px solid #00ffff33;
      border-radius: 20px;
      padding: 2em;
      box-shadow: 0 0 20px #00ffff22;
      max-width: 700px;
      width: 100%;
    }

    .bookmarklet-box h2 {
      text-align: center;
      color: #00ffff;
      margin-bottom: 1.5em;
    }

    #bookmarklet-list {
      list-style: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 1em;
    }

    .bookmarklet-item {
      background: #0d1117;
      border: 1px solid #00ffff44;
      padding: 1em;
      border-radius: 999px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: transform 0.2s, box-shadow 0.3s;
    }

    .bookmarklet-item:hover {
      transform: scale(1.02);
      box-shadow: 0 0 12px #00ffff44;
    }

    .bookmarklet-item a {
      color: #00ffff;
      font-weight: bold;
      text-decoration: none;
      font-size: 1.1em;
    }

    .bookmarklet-item div {
      color: #ccc;
      font-size: 0.9em;
      margin-top: 0.3em;
    }

    #island-menu {
      position: fixed;
      bottom: 2em;
      left: 50%;
      transform: translateX(-50%);
      background: #161b22;
      padding: 0.5em 1em;
      border-radius: 9999px;
      display: flex;
      gap: 1em;
      box-shadow: 0 0 10px #00ffff88, 0 0 20px #00ffff44;
      border: 2px solid #00ffff;
      overflow: hidden;
      z-index: 10;
      transition: max-width 0.3s ease;
      max-width: 300px;
    }

    .menu-item {
      padding: 0.5em 1.2em;
      border-radius: 9999px;
      cursor: pointer;
      position: relative;
      z-index: 1;
      transition: color 0.3s ease;
    }

    .menu-item:hover {
      color: #00ffff;
    }

    .menu-item.active {
      color: #00ffff;
    }

    .menu-indicator {
      position: absolute;
      top: 0;
      bottom: 0;
      background: #444;
      border-radius: 9999px;
      transition: left 0.3s ease, width 0.3s ease;
      pointer-events: none;
      z-index: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      overflow: hidden;
    }

    .ai-models {
      display: none;
      font-size: 0.8em;
      color: #888888;
      padding-right: 0.5em;
      white-space: nowrap;
    }

    .ai-models span {
      cursor: pointer;
      padding: 0 0.3em;
    }

    .ai-models span.active {
      color: #ffffff;
    }

    .menu-item.ai.active:hover .menu-indicator {
      width: 250px !important;
    }

    .menu-item.ai.active:hover .ai-models {
      display: block;
    }

    .menu-item.ai.active:hover ~ #island-menu {
      max-width: 400px;
    }

    #teacher-btn {
      position: fixed;
      bottom: 2em;
      right: 2em;
      background: yellow;
      color: black;
      padding: 0.6em 1.2em;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      box-shadow: 0 0 15px #ffff0088;
      z-index: 10;
    }

    #teacher-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px #ffff00cc;
    }

    #logo {
      position: fixed;
      bottom: 2em;
      left: 2em;
      width: 50px;
      height: 50px;
      border-radius: 12px;
      border: 2px solid #00ffff;
      background: #0d1117;
      box-shadow: 0 0 10px #00ffff88;
    }

    .notification {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.8em 1.5em;
      border-radius: 8px;
      color: white;
      font-size: 1em;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      min-width: 200px;
      text-align: center;
    }

    .notification.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .notification.success {
      background: #00cc00;
    }

    .notification.error {
      background: #ff5555;
    }

    .notification.info {
      background: #1f6feb;
    }
  </style>
</head>
<body>
  <div id="logo"></div>
  <canvas id="particle-canvas"></canvas>
  <div id="lock-screen" role="dialog" aria-labelledby="lock-title">
    <div class="site-title">BORED</div>
    <div class="lock-card">
      <h1 id="lock-title">Enter Password</h1>
      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="off"
        autofocus
        aria-label="Password input"
      />
      <button id="unlock-btn">Unlock</button>
    </div>
  </div>

  <div id="main-content">
    <div id="iframe-container">
      <iframe id="main-iframe" src="https://www.blackbox.ai/"></iframe>
    </div>
    <div id="bookmarklet-container">
      <div class="bookmarklet-box">
        <h2>Bookmarklets</h2>
        <ul id="bookmarklet-list"></ul>
      </div>
    </div>
    <div id="island-menu">
      <div class="menu-indicator">
        <div class="ai-models">
          <span data-model="blackbox" class="active">Blackbox</span>|
          <span data-model="deep">Deep</span>|
          <span data-model="gemini">Gemini</span>
        </div>
      </div>
      <div class="menu-item ai active" tabindex="0">AI</div>
      <div class="menu-item" tabindex="0">Games</div>
      <div class="menu-item" tabindex="0">Hacks</div>
    </div>
    <button id="teacher-btn">Teacher</button>
  </div>

  <script>
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const particles = [];
    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 1;
        this.speedX = Math.random() * 0.5 - 0.25;
        this.speedY = Math.random() * 0.5 - 0.25;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
        if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
      }
      draw() {
        ctx.fillStyle = 'rgba(0, 255, 255, 0.5)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function initParticles() {
      for (let i = 0; i < 100; i++) {
        particles.push(new Particle());
      }
    }

    function animateParticles() {
      if (document.hidden || document.getElementById("lock-screen").style.display === "none") {
        return;
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }

    initParticles();
    animateParticles();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      particles.length = 0;
      initParticles();
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) animateParticles();
    });

    const correctPassword = btoa("1234");

    const bookmarklets = [
      {
        name: "Edpuzzle",
        description: "Skip Edpuzzles and answer all right",
        code: "javascript:(() => { const script = document.createElement('script'); script.src = 'https://cdn.jsdelivr.net/gh/ading2210/edpuzzle-answers@latest/script.js'; document.body.appendChild(script); })();"
      },
      {
        name: "Tab Disguise",
        description: "Disguise any tab.",
        code: "javascript:(()=>{fetch('https://raw.githubusercontent.com/bananaontop/TabMask/main/Ignore.js').then(r=>r.text()).then(c=>eval(c)).catch(e=>alert('Failed to fetch code.',e));})();"
      }
    ];

    let currentAIModel = "blackbox"; // Track current AI model

    function showNotification(message, type = 'info') {
      const notification = document.createElement('div');
      notification.className = `notification ${type}`;
      notification.textContent = message;
      document.body.appendChild(notification);

      setTimeout(() => {
        notification.classList.add('show');
      }, 100);

      setTimeout(() => {
        notification.classList.remove('show');
        setTimeout(() => {
          notification.remove();
        }, 300);
      }, 3000);
    }

    function unlock() {
      const input = document.getElementById("password");
      const lockScreen = document.getElementById("lock-screen");
      const mainContent = document.getElementById("main-content");

      if (!input.value) {
        showNotification("Please enter a password", "error");
        input.focus();
        return;
      }

      lockScreen.classList.add('loading');
      setTimeout(() => {
        if (btoa(input.value) === correctPassword) {
          showNotification("Access granted!", "success");
          lockScreen.style.opacity = "0";
          setTimeout(() => {
            lockScreen.style.display = "none";
            mainContent.style.display = "flex";
            mainContent.style.opacity = "1";
            document.body.style.overflow = "auto";
            moveIndicatorTo(document.querySelector('.menu-item.active'));
            updateIframeDisplay();
          }, 500);
        } else {
          showNotification("Incorrect password", "error");
          input.value = "";
          input.focus();
          lockScreen.classList.remove('loading');
        }
      }, 1000);
    }

    function selectMenu(element) {
      document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
      element.classList.add('active');
      moveIndicatorTo(element);
      updateIframeDisplay();
      showNotification(`Switched to ${element.textContent}`, "info");
    }

    function updateIframeDisplay() {
      const active = document.querySelector('.menu-item.active').textContent.trim();
      const iframeContainer = document.getElementById("iframe-container");
      const bookmarkletContainer = document.getElementById("bookmarklet-container");
      const iframe = document.getElementById("main-iframe");

      const urls = {
        "AI": {
          "blackbox": "https://www.blackbox.ai/",
          "deep": "https://deep.ai/",
          "gemini": "https://gemini.google.com/"
        },
        "Games": "https://roblox-unblock.github.io/#google_vignette"
      };

      if (active === "Hacks") {
        iframeContainer.style.display = "none";
        bookmarkletContainer.style.display = "flex";
        renderBookmarklets();
      } else {
        bookmarkletContainer.style.display = "none";
        if (urls[active]) {
          iframeContainer.style.display = "block";
          if (active === "AI") {
            iframe.src = urls.AI[currentAIModel];
          } else {
            iframe.src = urls[active];
          }
        } else {
          iframeContainer.style.display = "none";
        }
      }
    }

    function renderBookmarklets() {
      const list = document.getElementById("bookmarklet-list");
      list.innerHTML = "";

      bookmarklets.forEach(b => {
        const li = document.createElement("li");
        li.className = "bookmarklet-item";

        const link = document.createElement("a");
        link.href = b.code;
        link.textContent = b.name;
        link.addEventListener("click", () => {
          showNotification(`Activated ${b.name}`, "info");
        });

        const desc = document.createElement("div");
        desc.textContent = b.description;

        li.appendChild(link);
        li.appendChild(desc);
        list.appendChild(li);
      });
    }

    function moveIndicatorTo(element) {
      const indicator = document.querySelector('.menu-indicator');
      const menuRect = element.parentElement.getBoundingClientRect();
      const itemRect = element.getBoundingClientRect();

      const left = itemRect.left - menuRect.left;
      const width = itemRect.width;

      indicator.style.left = `${left}px`;
      indicator.style.width = `${width}px`;
    }

    function selectAIModel(model) {
      currentAIModel = model;
      document.querySelectorAll('.ai-models span').forEach(span => {
        span.classList.toggle('active', span.dataset.model === model);
      });
      updateIframeDisplay();
      showNotification(`Switched to ${model.charAt(0).toUpperCase() + model.slice(1)}`, "info");
    }

    window.addEventListener('load', () => {
      const active = document.querySelector('.menu-item.active');
      if (active) moveIndicatorTo(active);
    });

    document.getElementById("password").addEventListener("keypress", (event) => {
      if (event.key === "Enter") unlock();
    });

    document.getElementById("unlock-btn").addEventListener("click", unlock);

    document.querySelectorAll(".menu-item").forEach(item => {
      item.addEventListener("click", () => selectMenu(item));
      item.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          selectMenu(item);
        }
      });
    });

    document.querySelectorAll(".ai-models span").forEach(span => {
      span.addEventListener("click", (e) => {
        e.stopPropagation();
        selectAIModel(span.dataset.model);
      });
    });

    document.getElementById("teacher-btn").addEventListener("click", () => {
      showNotification("Redirecting to Google Classroom", "info");
      window.location.href = "https://classroom.google.com/";
    });

    const iframe = document.getElementById("main-iframe");
    iframe.addEventListener("error", () => {
      document.getElementById("iframe-container").innerHTML =
        "<p style='color: #ff5555; text-align: center;'>Failed to load content. Please try again later.</p>";
      showNotification("Failed to load content", "error");
    });
  </script>
</body>
</html>
